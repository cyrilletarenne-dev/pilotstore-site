<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message envoyé — PilotStore</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:linear-gradient(150deg,#1f2937 0%,#374151 55%,#111827 100%); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .box { max-width:520px; }
  .check { width:72px; height:72px; border-radius:50%; background:#10b981; margin:0 auto 28px; display:flex; align-items:center; justify-content:center; }
  .check svg { width:36px; height:36px; }
  h1 { font-size:clamp(26px,5vw,34px); font-weight:900; letter-spacing:-0.5px; margin-bottom:14px; }
  p { color:#d1d5db; font-size:17px; line-height:1.6; margin-bottom:32px; }
  a.btn { display:inline-block; background:#10b981; color:#fff; text-decoration:none; font-weight:700; padding:13px 28px; border-radius:10px; }
  a.btn:hover { background:#059669; }
  .mark { margin-top:48px; font-weight:800; color:#9ca3af; font-size:14px; }
  .mark .p { color:#34d399; }
</style>
</head>
<body>
  <div class="box">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Message bien envoyé !</h1>
    <p>Merci pour votre intérêt pour PilotStore. Nous revenons vers vous rapidement — et si vous êtes de passage à Tours, la démonstration se fait en magasin, autour d'un café.</p>
    <a class="btn" href="/">Retour au site</a>
    <div class="mark"><span class="p">Pilot</span>Store — Le copilote du quotidien</div>
  </div>
</body>
</html>
